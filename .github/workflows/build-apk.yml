
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download Vosk English Model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip

          unzip -q /tmp/vosk-model.zip -d app/src/main/assets

          mv app/src/main/assets/vosk-model-small-en-us-0.15 \
             app/src/main/assets/vosk-model

          echo "vosk-english-0.15" > app/src/main/assets/vosk-model/uuid

          test -f app/src/main/assets/vosk-model/am/final.mdl
          echo "Vosk model prepared successfully"
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peters-Voice-Control-APK
          path: app/build/outputs/apk/debug/*.apk
